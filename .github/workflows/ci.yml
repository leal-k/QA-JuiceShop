name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: Testes de API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar as dependências
        run: npm ci

      - name: Subir o Juice Shop
        run: docker compose up -d

      - name: Esperar o Juice Shop ficar pronto
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/rest/admin/application-version; then
              echo
              echo "Juice Shop pronto"
              exit 0
            fi
            echo "Tentativa $i: ainda não respondeu, esperando 2s..."
            sleep 2
          done
          echo "O Juice Shop não ficou pronto a tempo"
          docker compose logs
          exit 1

      - name: Rodar os testes de API
        run: npx playwright test --project=api

      - name: Publicar o relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Logs do Juice Shop (só se algo falhou)
        if: failure()
        run: docker compose logs